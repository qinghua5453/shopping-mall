server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: shopping-mall
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:mall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:mall}
    password: ${DB_PASSWORD:mall_dev_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

app:
  auth:
    jwt-secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-2026}
    token-ttl: 30m
  bootstrap-admin:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
    username: ${ADMIN_INITIAL_USERNAME:admin}
    password: ${ADMIN_INITIAL_PASSWORD:Admin@123456}
    nickname: ${ADMIN_INITIAL_NICKNAME:超级管理员}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
    com.shopmall: info
